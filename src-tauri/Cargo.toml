[package]
name = "codenest"
version = "1.1.0"
description = "Cross-platform local project manager"
authors = [ "MidnightCrowing" ]
license = "MIT"
edition = "2021"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[lib]
name = "codenest_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib",
]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [ ] }

[dependencies]
dirs = "6.0.0"
ignore = "0.4.31"
keyring = { version = "4.1.5", default-features = false, features = [ "v1" ] }
open = "5.4.0"
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "rustls",
] }
rfd = "0.17.2"
roxmltree = "0.21.1"
rusqlite = { version = "0.40.1", features = [ "bundled" ] }
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [ ] }
trash = "5.2.6"
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
